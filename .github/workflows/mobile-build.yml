name: Mobile Build & Publish

on:
  push:
    branches: [master]
    paths: ['src/Vaulta.App/**', 'src/Vaulta.App.Core/**']
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore src/Vaulta.App/Vaulta.App.csproj

      - name: Build Android Release
        run: dotnet build src/Vaulta.App/Vaulta.App.csproj -c Release -f net10.0-android --no-restore

      - name: Publish AAB (signed)
        if: github.ref == 'refs/heads/master'
        env:
          VAULTA_KEYSTORE_PASS: ${{ secrets.VAULTA_KEYSTORE_PASS }}
        run: |
          echo "${{ secrets.VAULTA_KEYSTORE_BASE64 }}" | base64 -d > vaulta-release.keystore
          dotnet publish src/Vaulta.App/Vaulta.App.csproj `
            -c Release `
            -f net10.0-android `
            -p:AndroidPackageFormat=aab `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore=vaulta-release.keystore `
            -p:AndroidSigningKeyAlias=vaulta `
            -p:AndroidSigningKeyPass=$env:VAULTA_KEYSTORE_PASS `
            -p:AndroidSigningStorePass=$env:VAULTA_KEYSTORE_PASS `
            --no-build

      - name: Upload AAB artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: vaulta-aab
          path: '**/*.aab'
          retention-days: 30

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run App.Core unit tests
        run: dotnet test tests/Vaulta.App.Core.UnitTests/ -c Release --verbosity normal